<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Ranking App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Courier New', monospace;
        }
        
        .animate-pulse {
            animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .cyberpunk-bg {
            background: radial-gradient(circle at 25% 25%, #ffff00 0%, transparent 50%), 
                       radial-gradient(circle at 75% 75%, #00ff00 0%, transparent 50%);
            opacity: 0.1;
        }
        
        .gradient-text {
            background: linear-gradient(to right, #facc15, #22c55e);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
    </style>
</head>
<body>
    <div class="min-h-screen bg-black relative overflow-hidden">
        <!-- Background Effects -->
        <div class="absolute inset-0 bg-gradient-to-br from-yellow-900/20 via-green-900/10 to-black/30"></div>
        <div class="absolute inset-0 cyberpunk-bg"></div>
        
        <!-- Main Content -->
        <div class="relative z-10 p-4 sm:p-6">
            <div class="max-w-7xl mx-auto">
                <!-- Title -->
                <h1 class="text-2xl sm:text-4xl lg:text-5xl font-bold text-center mb-6 sm:mb-12 gradient-text font-mono tracking-wider sm:tracking-widest uppercase break-words">
                    who will go first?
                </h1>

                <!-- Input Section -->
                <div class="relative bg-black/90 border-2 border-yellow-400 rounded-none shadow-2xl p-4 sm:p-6 mb-6 sm:mb-8 backdrop-blur-sm">
                    <div class="absolute -top-1 -left-1 w-4 h-4 bg-yellow-400"></div>
                    <div class="absolute -top-1 -right-1 w-4 h-4 bg-yellow-400"></div>
                    <div class="absolute -bottom-1 -left-1 w-4 h-4 bg-yellow-400"></div>
                    <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-yellow-400"></div>
                    
                    <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 mb-4">
                        <input
                            type="text"
                            id="nameInput"
                            placeholder="enter name..."
                            class="flex-1 min-w-0 w-full px-4 py-3 bg-black border-2 border-green-500 rounded-none focus:outline-none focus:border-yellow-400 text-yellow-400 placeholder-gray-600 font-mono text-lg tracking-wider uppercase"
                        />
                        <button
                            id="addBtn"
                            class="px-8 py-3 bg-green-600 text-black font-black rounded-none hover:bg-yellow-400 hover:text-black transition-all duration-200 font-mono tracking-wider uppercase border-2 border-green-600 hover:border-yellow-400 transform hover:scale-105"
                        >
                            jack in
                        </button>
                    </div>
                    
                    <button
                        id="clearBtn"
                        class="px-6 py-2 bg-black text-green-500 rounded-none hover:bg-green-500 hover:text-black transition-all duration-200 font-mono border-2 border-green-500 tracking-wider uppercase hidden"
                    >
                        reset matrix
                    </button>
                </div>

                <!-- Main Panels -->
                <div class="flex flex-col md:flex-row gap-6 md:gap-8">
                    <!-- Names Panel -->
                    <div class="flex-1 min-w-0 relative bg-black/90 border-2 border-green-500 rounded-none shadow-2xl p-4 sm:p-6 backdrop-blur-sm">
                        <div class="absolute -top-1 -left-1 w-3 h-3 bg-green-500"></div>
                        <div class="absolute -top-1 -right-1 w-3 h-3 bg-green-500"></div>
                        
                        <h2 class="text-lg sm:text-2xl font-black mb-6 text-green-400 font-mono tracking-widest uppercase border-b-2 border-green-400 pb-2">
                            neural links (<span id="nameCount">0</span>)
                        </h2>
                        
                        <div id="namesList" class="space-y-3">
                            <p class="text-gray-500 italic font-mono text-center py-8 tracking-wider">no connections found...</p>
                        </div>

                        <div id="runSection" class="mt-8 hidden">
                            <button
                                id="runBtn"
                                class="w-full py-4 rounded-none font-black transition-all duration-200 font-mono border-4 tracking-wider sm:tracking-widest uppercase text-base sm:text-xl transform bg-green-600 text-black hover:bg-yellow-400 hover:text-black border-green-600 hover:border-yellow-400 shadow-2xl hover:scale-105"
                            >
                                run protocol
                            </button>
                        </div>
                    </div>

                    <!-- Rankings Panel -->
                    <div class="flex-1 min-w-0 relative bg-black/90 border-2 border-yellow-500 rounded-none shadow-2xl p-4 sm:p-6 backdrop-blur-sm">
                        <div class="absolute -top-1 -left-1 w-3 h-3 bg-yellow-500"></div>
                        <div class="absolute -top-1 -right-1 w-3 h-3 bg-yellow-500"></div>
                        
                        <h2 class="text-lg sm:text-2xl font-black mb-6 text-yellow-400 font-mono tracking-widest uppercase border-b-2 border-yellow-400 pb-2">
                            order
                        </h2>
                        
                        <div id="rankingsList" class="space-y-3">
                            <p class="text-gray-500 italic font-mono text-center py-8 tracking-wider">awaiting input...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // App State
        let names = [];
        let rankings = [];
        let availableNames = [];
        let highlightedIndex = -1;
        let isRunning = false;
        let currentRank = 1;

        // DOM Elements
        const nameInput = document.getElementById('nameInput');
        const addBtn = document.getElementById('addBtn');
        const clearBtn = document.getElementById('clearBtn');
        const namesList = document.getElementById('namesList');
        const rankingsList = document.getElementById('rankingsList');
        const runBtn = document.getElementById('runBtn');
        const runSection = document.getElementById('runSection');
        const nameCount = document.getElementById('nameCount');

        // Add name function
        function addName() {
            const name = nameInput.value.trim();
            if (name && !names.includes(name)) {
                names.push(name);
                availableNames = [...names];
                rankings = new Array(names.length).fill('');
                nameInput.value = '';
                currentRank = 1;
                updateDisplay();
            }
        }

        // Remove name function
        function removeName(index) {
            names.splice(index, 1);
            availableNames = [...names];
            rankings = new Array(names.length).fill('');
            currentRank = 1;
            updateDisplay();
        }

        // Clear all function
        function clearAll() {
            names = [];
            availableNames = [];
            rankings = [];
            currentRank = 1;
            highlightedIndex = -1;
            isRunning = false;
            updateDisplay();
        }

        // Update display function
        function updateDisplay() {
            // Update name count
            nameCount.textContent = names.length;

            // Update names list
            if (names.length === 0) {
                namesList.innerHTML = '<p class="text-gray-500 italic font-mono text-center py-8 tracking-wider">no connections found...</p>';
                clearBtn.classList.add('hidden');
                runSection.classList.add('hidden');
            } else {
                clearBtn.classList.remove('hidden');
                runSection.classList.remove('hidden');
                
                namesList.innerHTML = names.map((name, index) => {
                    const isAvailable = availableNames.includes(name);
                    const isHighlighted = isAvailable && availableNames.indexOf(name) === highlightedIndex;
                    
                    let classes = 'relative flex items-center justify-between p-4 rounded-none transition-all duration-200 border-2 font-mono transform ';
                    
                    if (isAvailable) {
                        if (isHighlighted) {
                            classes += 'bg-yellow-400 text-black scale-105 shadow-2xl border-yellow-400 animate-pulse';
                        } else {
                            classes += 'bg-black text-green-400 border-green-600 hover:border-yellow-400 hover:text-yellow-400';
                        }
                    } else {
                        classes += 'bg-gray-900 text-gray-600 border-gray-700 opacity-50';
                    }
                    
                    return `
                        <div class="${classes}">
                            <span class="font-black tracking-wider uppercase text-lg break-all min-w-0">${name}</span>
                            ${isAvailable ? `<button onclick="removeName(${index})" ${isRunning ? 'disabled' : ''} class="text-green-400 hover:text-yellow-400 text-2xl font-black transform hover:scale-125 transition-all">×</button>` : ''}
                        </div>
                    `;
                }).join('');
            }

            // Update rankings list
            if (names.length === 0) {
                rankingsList.innerHTML = '<p class="text-gray-500 italic font-mono text-center py-8 tracking-wider">awaiting input...</p>';
            } else {
                rankingsList.innerHTML = rankings.map((rankedName, index) => {
                    const classes = rankedName 
                        ? 'bg-green-900/30 border-yellow-400 text-yellow-400'
                        : 'bg-black border-gray-700 border-dashed';
                    
                    return `
                        <div class="relative flex items-center p-4 rounded-none border-2 transition-all duration-300 font-mono ${classes}">
                            <div class="flex items-center">
                                <span class="font-black text-2xl w-12 text-yellow-400 tracking-wider">${String(index + 1).padStart(2, '0')}.</span>
                                <span class="ml-4 text-lg font-black tracking-wider uppercase break-all min-w-0 ${rankedName ? 'text-green-400' : 'text-gray-600'}">${rankedName || 'empty slot'}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Update run button
            if (isRunning) {
                runBtn.textContent = 'executing...';
                runBtn.className = 'w-full py-4 rounded-none font-black transition-all duration-200 font-mono border-4 tracking-wider sm:tracking-widest uppercase text-base sm:text-xl transform bg-gray-800 text-gray-500 cursor-not-allowed border-gray-600';
                runBtn.disabled = true;
            } else {
                runBtn.textContent = 'run protocol';
                runBtn.className = 'w-full py-4 rounded-none font-black transition-all duration-200 font-mono border-4 tracking-wider sm:tracking-widest uppercase text-base sm:text-xl transform bg-green-600 text-black hover:bg-yellow-400 hover:text-black border-green-600 hover:border-yellow-400 shadow-2xl hover:scale-105';
                runBtn.disabled = false;
            }
        }

        // Run ranking animation
        function runRanking() {
            if (availableNames.length === 0) return;
            
            // If only one name left, auto-assign it
            if (availableNames.length === 1) {
                const lastName = availableNames[0];
                rankings[currentRank - 1] = lastName;
                availableNames = [];
                currentRank++;
                updateDisplay();
                return;
            }

            isRunning = true;
            updateDisplay();
            
            // Pre-select a truly random winner
            const randomWinnerIndex = Math.floor(Math.random() * availableNames.length);
            
            let currentIndex = Math.floor(Math.random() * availableNames.length); // Start at random position
            const animationDuration = 2000; // 2 seconds total
            const startTime = Date.now();
            let intervalSpeed = 80; // Start fast

            const animate = () => {
                const elapsed = Date.now() - startTime;
                
                // Update highlighted index - cycle through randomly
                highlightedIndex = currentIndex % availableNames.length;
                currentIndex++;
                updateDisplay();
                
                if (elapsed >= animationDuration) {
                    // Time's up! Use the pre-selected random winner
                    const selectedName = availableNames[randomWinnerIndex];
                    
                    // Final highlight on the winner for dramatic effect
                    highlightedIndex = randomWinnerIndex;
                    updateDisplay();
                    
                    setTimeout(() => {
                        // Add to rankings
                        rankings[currentRank - 1] = selectedName;
                        
                        // Remove from available names
                        availableNames = availableNames.filter((_, index) => index !== randomWinnerIndex);
                        
                        // Reset for next round
                        currentRank++;
                        highlightedIndex = -1;
                        isRunning = false;
                        updateDisplay();
                    }, 300); // Brief pause to show final selection
                } else {
                    // Continue animating - slow down as time progresses
                    const progress = elapsed / animationDuration;
                    intervalSpeed = 80 + (progress * 150); // Slow down from 80ms to 230ms
                    setTimeout(animate, intervalSpeed);
                }
            };

            animate();
        }

        // Event listeners
        addBtn.addEventListener('click', addName);
        clearBtn.addEventListener('click', clearAll);
        runBtn.addEventListener('click', runRanking);
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addName();
            }
        });

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
